name: OpenYap
options:
  bundleIdPrefix: dev.pabu
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OpenYap:
    type: application
    platform: macOS
    sources:
      - path: OpenYap
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pabu.openyap
        PRODUCT_NAME: OpenYap
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenYap
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: OpenYap needs microphone access to turn your speech into text on this Mac.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
    postCompileScripts:
      - name: Remove extended attributes before signing
        script: xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" || true
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - OpenYapTests
  OpenYapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenYapTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OpenYap
