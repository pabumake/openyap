name: Publish signed macOS prerelease

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/openyap-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$DEVELOPER_ID_P12_PASSWORD" -A -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          echo "OPENYAP_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "OPENYAP_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Restore current appcast
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          appcast="$RUNNER_TEMP/release/appcast.xml"
          if ! curl --fail --silent --show-error --location \
            https://pabumake.github.io/openyap/appcast.xml \
            --output "$appcast"; then
            rm -f "$appcast"
          fi

      - name: Build, sign, notarize, and package tagged source
        env:
          OPENYAP_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          OPENYAP_NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          OPENYAP_NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          OPENYAP_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/package-release-mac.sh "$RELEASE_TAG" "$RUNNER_TEMP/release"

      - name: Prepare GitHub release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo 'Requires macOS 26 and an Apple silicon Mac.'
            echo
            cat "$RUNNER_TEMP/release/OpenYap-$RELEASE_VERSION-macOS-arm64.md"
          } > "$notes"

      - name: Upload appcast for Pages
        uses: actions/upload-artifact@v7
        with:
          name: appcast-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/release/appcast.xml
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/OpenYap-$RELEASE_VERSION-macOS-arm64.zip" \
            "$RUNNER_TEMP/release/OpenYap-$RELEASE_VERSION-macOS-arm64.zip.sha256" \
            "$RUNNER_TEMP/release/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "OpenYap $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Delete temporary signing keychain
        if: always()
        run: |
          if [[ -n "${OPENYAP_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$OPENYAP_SIGNING_KEYCHAIN" || true
          fi
