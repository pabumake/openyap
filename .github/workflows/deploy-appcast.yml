name: Deploy release appcast

on:
  workflow_run:
    workflows:
      - Publish signed macOS prerelease
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Release workflow run that contains the signed appcast artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-appcast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve release workflow run
        id: source
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$COMPLETED_RUN_ID"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid release workflow run ID: $run_id" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download signed appcast
        uses: actions/download-artifact@v8
        with:
          pattern: appcast-*
          path: ${{ runner.temp }}/pages
          merge-multiple: true
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate appcast artifact
        run: test -s "$RUNNER_TEMP/pages/appcast.xml"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
